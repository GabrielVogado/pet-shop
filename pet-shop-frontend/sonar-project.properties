# SonarQube Cloud: frontend. Analise disparada pelo ci.yml.
# Organizacao e chave precisam ser exatamente as criadas no painel
# (passo a passo em Documentos/10-git-flow/SONAR.md).
sonar.organization=gabrielvogado
sonar.projectKey=gabrielvogado_pet-shop-frontend
sonar.projectName=Pertim - Frontend

# src = protótipo; apps e packages = web nova em TypeScript (ADR-010).
sonar.sources=src,apps,packages
sonar.tests=src,apps,packages,tests
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,src/test/**,tests/**
sonar.exclusions=**/*.test.js,**/*.test.jsx,**/*.test.ts,**/*.test.tsx,src/test/**,apps/*/dist/**
sonar.coverage.exclusions=src/test/**,src/main.jsx,apps/*/src/main.tsx,apps/*/vite.config.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
