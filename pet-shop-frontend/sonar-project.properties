# SonarQube Cloud: frontend. Analise disparada pelo ci.yml.
# Organizacao e chave precisam ser exatamente as criadas no painel
# (passo a passo em Documentos/10-git-flow/SONAR.md).
sonar.organization=gabrielvogado
sonar.projectKey=gabrielvogado_pet-shop-frontend
sonar.projectName=Pertim - Frontend

sonar.sources=src
sonar.tests=src,tests
sonar.test.inclusions=src/**/*.test.js,src/**/*.test.jsx,src/test/**,tests/**
sonar.exclusions=src/**/*.test.js,src/**/*.test.jsx,src/test/**
sonar.coverage.exclusions=src/test/**,src/main.jsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
