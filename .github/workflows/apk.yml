name: APK Android

on:
  push:
    branches: [develop, master]
    paths: ['pet-shop-android/**', '.github/workflows/apk.yml']
  pull_request:
    branches: [develop, master]
    paths: ['pet-shop-android/**', '.github/workflows/apk.yml']
  # Gera o APK sob demanda em qualquer branch (aba Actions > APK Android > Run workflow).
  workflow_dispatch:

# Um novo push no mesmo PR cancela a execucao anterior; em develop/master nunca cancela.
concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apk:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pet-shop-android
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ja traz o Android SDK. Esta acao valida o gradle-wrapper.jar e guarda o cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK de debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # APK assinado com a chave de debug: instala em qualquer aparelho com "fontes desconhecidas".
      # O APK de release (assinado com a chave da loja, para a Play Store) precisa da keystore como secret.
      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          # Em PR, github.sha e o commit de merge temporario; o nome usa o commit da branch.
          name: pertim-tutor-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: pet-shop-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-android
          path: pet-shop-android/app/build/reports/tests
          retention-days: 7
          if-no-files-found: ignore
