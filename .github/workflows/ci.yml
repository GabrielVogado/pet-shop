name: CI - Build e Testes

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  # Gera o APK sob demanda em qualquer branch (aba Actions > CI - Build e Testes > Run workflow).
  workflow_dispatch:

# Um novo push no mesmo PR cancela a execucao anterior; em develop/master nunca cancela.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mudancas:
    # Decide quais areas rodam. Os jobs abaixo sao PULADOS (nao filtrados por `paths`
    # no gatilho): um job pulado conta como sucesso para check obrigatorio, enquanto
    # um workflow que nem dispara deixaria o check eternamente pendente.
    name: Areas alteradas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
      android: ${{ steps.filtro.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: filtro
        # Na execucao manual nao ha diff para comparar: so o APK roda (veja o job android).
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'pet-shop-backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'pet-shop-frontend/**'
              - '.github/workflows/ci.yml'
            android:
              - 'pet-shop-android/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Quarkus)
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # So "true"/"false": o token nao fica exposto aos passos de build. A analise
      # pula enquanto o secret nao existir (e em PR de fork) sem reprovar o CI.
      TEM_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
    defaults:
      run:
        working-directory: pet-shop-backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Historico completo: o Sonar usa o blame para separar codigo novo do antigo.
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pet-shop-backend/pom.xml

      # Hoje so existem testes unitarios (JUnit + Mockito), sem @QuarkusTest, entao
      # nao ha MongoDB nem chaves JWT aqui. Quando entrar o primeiro teste de
      # integracao: Testcontainers (Docker ja vem no runner) e JWT_PUBLIC_KEY /
      # JWT_PRIVATE_KEY de teste via env, porque o application.properties as exige.
      - name: Compilar, testar e empacotar
        run: mvn -B -ntp verify

      - name: Analise SonarQube Cloud (backend)
        if: env.TEM_SONAR == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # Reaproveita classes e o XML do JaCoCo gerados pelo `verify` acima.
        run: mvn -B -ntp sonar:sonar

      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-backend
          path: pet-shop-backend/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + Vite)
    needs: mudancas
    if: needs.mudancas.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEM_SONAR: ${{ secrets.SONAR_TOKEN != '' }}
    defaults:
      run:
        working-directory: pet-shop-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pet-shop-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Testes (Vitest)
        run: npm test -- --coverage

      - name: Build
        # Roda mesmo com o teste vermelho, para o build ter resultado proprio.
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Analise SonarQube Cloud (frontend)
        # Roda tambem com teste vermelho: a cobertura sai mesmo assim (reportOnFailure).
        if: ${{ !cancelled() && env.TEM_SONAR == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: pet-shop-frontend


  android:
    name: Android (APK)
    needs: mudancas
    if: needs.mudancas.outputs.android == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pet-shop-android
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O runner ja traz o Android SDK. Esta acao valida o gradle-wrapper.jar e guarda o cache.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK de debug
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      # APK assinado com a chave de debug: instala em qualquer aparelho com "fontes desconhecidas".
      # O APK de release (assinado com a chave da loja, para a Play Store) precisa da keystore como secret.
      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: pertim-tutor-debug-${{ github.sha }}
          path: pet-shop-android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-android
          path: pet-shop-android/app/build/reports/tests
          retention-days: 7
          if-no-files-found: ignore

  # O E2E (Playwright) nao roda aqui: precisa do backend e do banco no ar.
