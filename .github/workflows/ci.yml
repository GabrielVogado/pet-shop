name: CI - Build e Testes

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

# Um novo push no mesmo PR cancela a execucao anterior; em develop/master nunca cancela.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  mudancas:
    # Decide quais areas rodam. Os jobs abaixo sao PULADOS (nao filtrados por `paths`
    # no gatilho): um job pulado conta como sucesso para check obrigatorio, enquanto
    # um workflow que nem dispara deixaria o check eternamente pendente.
    name: Areas alteradas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filtro
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'pet-shop-backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'pet-shop-frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Quarkus)
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pet-shop-backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pet-shop-backend/pom.xml

      # Hoje so existem testes unitarios (JUnit + Mockito), sem @QuarkusTest, entao
      # nao ha MongoDB nem chaves JWT aqui. Quando entrar o primeiro teste de
      # integracao: Testcontainers (Docker ja vem no runner) e JWT_PUBLIC_KEY /
      # JWT_PRIVATE_KEY de teste via env, porque o application.properties as exige.
      - name: Compilar, testar e empacotar
        run: mvn -B -ntp verify

      - name: Publicar relatorios de teste
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-backend
          path: pet-shop-backend/target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + Vite)
    needs: mudancas
    if: needs.mudancas.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pet-shop-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pet-shop-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Testes (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  # O E2E (Playwright) nao roda aqui: precisa do backend e do banco no ar.
